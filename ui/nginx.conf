server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: nginx стартует, даже если api ещё не поднялся
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /docs {
        proxy_pass $api/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $api/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
