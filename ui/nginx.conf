server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: nginx стартует, даже если api ещё не поднялся.
    # proxy_pass с переменной не подставляет путь сам, поэтому путь передаём явно.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /docs {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
